name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  stellar-contracts:
    name: Stellar Contract Checks
    runs-on: ubuntu-latest
    # Set the default working directory for this entire job
    defaults:
      run:
        working-directory: Stellar
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Stellar

      - name: Install Stellar CLI
        run: |
          curl -L -o stellar-cli.deb https://github.com/stellar/stellar-cli/releases/download/v26.0.0/stellar-cli_26.0.0_amd64.deb
          sudo dpkg -i stellar-cli.deb

      - name: Add wasm target
        run: rustup target add wasm32v1-none

      - name: Install cargo-audit
        run: cargo install cargo-audit --version "0.22.1" --locked

      - name: Rust dependency audit
        run: cargo audit --file Cargo.lock

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        run: cargo test

      - name: Build contract wasm
        run: stellar contract build --manifest-path contracts/ylds-controller/Cargo.toml
